x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment: &app-env
    DATABASE_URL: postgresql://postgres:CHANGE_ME@postgres:5432/resolveai
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-5-5}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: resolveai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: generates the synthetic dataset and seeds the database (skipped if already seeded).
  seed:
    <<: *app
    command: sh -c "python scripts/generate_dataset.py && python scripts/init_db.py"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *app
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *app-env
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-server:
    <<: *app
    command: python mcp_server/server.py
    environment:
      <<: *app-env
      MCP_TRANSPORT: streamable-http
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  streamlit:
    <<: *app
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
