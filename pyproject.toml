[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveai"
version = "1.0.0"
description = "Multi-Agent Incident Intelligence & Troubleshooting Platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "sqlalchemy>=2.0.28",
    "rank-bm25>=0.2.2",
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "ragas>=0.1.0",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
    "jinja2>=3.1.3",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
include = ["backend*", "mcp_server*", "evaluation*"]
